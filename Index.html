<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Absensi Prakerin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    .hidden { display: none !important; }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- LOADING OVERLAY -->
  <div id="loadingOverlay" class="hidden fixed inset-0 bg-black/50 z-50 flex flex-col items-center justify-center text-white">
    <div class="loader mb-3"></div>
    <p id="loadingText" class="font-medium">Memproses data...</p>
  </div>

  <!-- 1. HALAMAN LOGIN -->
  <div id="viewLogin" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
      <div class="text-center mb-6">
        <div class="bg-blue-600 text-white w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl shadow">
          <i class="fas fa-user-check"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800">Absensi Prakerin</h1>
        <p class="text-sm text-slate-500">Silakan masuk menggunakan NISN / NIP</p>
      </div>
      <form id="formLogin" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">NISN (Siswa) / NIP (Guru)</label>
          <input type="text" id="loginId" required class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan ID Anda">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Password</label>
          <input type="password" id="loginPassword" required class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow">
          Masuk
        </button>
      </form>
    </div>
  </div>

  <!-- 2. DASHBOARD SISWA -->
  <div id="viewSiswa" class="hidden max-w-lg mx-auto min-h-screen bg-white shadow-md flex flex-col">
    <header class="bg-blue-600 text-white p-6 rounded-b-3xl shadow">
      <div class="flex justify-between items-start">
        <div>
          <p class="text-blue-100 text-xs uppercase tracking-wider font-semibold">Dashboard Siswa Prakerin</p>
          <h2 id="siswaHeaderNama" class="text-xl font-bold mt-1">Nama Siswa</h2>
          <p id="siswaHeaderKelas" class="text-sm text-blue-100 mt-0.5">Kelas</p>
        </div>
        <button onclick="logout()" class="bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
          <i class="fas fa-sign-out-alt"></i> Keluar
        </button>
      </div>
    </header>

    <!-- Menu Utama -->
    <div id="siswaMenuUtama" class="p-6 flex-1 flex flex-col justify-center gap-5">
      <button onclick="bukaFormAbsensi()" class="bg-emerald-500 hover:bg-emerald-600 text-white p-6 rounded-2xl shadow-md flex items-center gap-4 transition text-left">
        <div class="bg-white/20 w-14 h-14 rounded-xl flex items-center justify-center text-2xl">
          <i class="fas fa-camera"></i>
        </div>
        <div>
          <h3 class="text-lg font-bold">Lapor Absensi</h3>
          <p class="text-xs text-emerald-50">Catat kehadiran Masuk, Pulang, atau Izin</p>
        </div>
      </button>

      <button onclick="bukaRiwayatSiswa()" class="bg-indigo-600 hover:bg-indigo-700 text-white p-6 rounded-2xl shadow-md flex items-center gap-4 transition text-left">
        <div class="bg-white/20 w-14 h-14 rounded-xl flex items-center justify-center text-2xl">
          <i class="fas fa-history"></i>
        </div>
        <div>
          <h3 class="text-lg font-bold">Riwayat Absensi</h3>
          <p class="text-xs text-indigo-100">Lihat daftar kehadiran yang telah terkirim</p>
        </div>
      </button>
    </div>

    <!-- Form Lapor Absensi -->
    <div id="siswaFormAbsensi" class="hidden p-6 flex-1 overflow-y-auto">
      <h3 class="text-lg font-bold mb-4 border-b pb-2">Form Lapor Absensi</h3>
      <form id="formAbsen" class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500">ID / NISN</label>
            <input type="text" id="absenNisn" readonly class="w-full bg-slate-100 px-3 py-2 rounded-lg text-sm font-medium border">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500">Nama Siswa</label>
            <input type="text" id="absenNama" readonly class="w-full bg-slate-100 px-3 py-2 rounded-lg text-sm font-medium border">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Status Kehadiran</label>
          <select id="absenStatus" onchange="ubahStatusAbsen()" class="w-full px-3 py-2 border rounded-xl text-sm font-semibold bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="Masuk">Hadir - Masuk</option>
            <option value="Pulang">Hadir - Pulang</option>
            <option value="Izin">Izin / Sakit / Keperluan Lain</option>
          </select>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-500">Hari</label>
            <input type="text" id="absenHari" readonly class="w-full bg-slate-100 px-3 py-2 rounded-lg text-sm border">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500">Tanggal</label>
            <input type="text" id="absenTanggal" readonly class="w-full bg-slate-100 px-3 py-2 rounded-lg text-sm border">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500">Waktu</label>
            <input type="text" id="absenWaktu" readonly class="w-full bg-slate-100 px-3 py-2 rounded-lg text-sm border">
          </div>
        </div>

        <div id="wrapperKeterangan" class="hidden">
          <label class="block text-xs font-semibold text-slate-500 mb-1">Keterangan / Alasan Izin</label>
          <textarea id="absenKeterangan" rows="2" placeholder="Tuliskan alasan izin atau sakit..." class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <div id="wrapperFoto">
          <label class="block text-xs font-semibold text-slate-500 mb-1">Ambil / Unggah Foto Bukti</label>
          <input type="file" id="absenFotoInput" accept="image/*" capture="environment" class="w-full text-sm file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 font-medium border rounded-lg p-1">
          <img id="fotoPreview" class="hidden mt-3 w-full h-48 object-cover rounded-xl border" alt="Pratinjau Foto">
        </div>

        <div id="wrapperLokasi">
          <label class="block text-xs font-semibold text-slate-500 mb-1">Lokasi Terkini (GPS)</label>
          <div class="flex gap-2">
            <input type="text" id="absenLokasiText" readonly placeholder="Mendeteksi koordinat..." class="w-full bg-slate-100 px-3 py-2 rounded-lg text-xs border">
            <button type="button" onclick="ambilLokasi()" class="bg-slate-200 hover:bg-slate-300 px-3 py-2 rounded-lg text-xs font-semibold">
              <i class="fas fa-sync-alt"></i>
            </button>
          </div>
          <input type="hidden" id="absenLat">
          <input type="hidden" id="absenLng">
        </div>

        <div class="flex gap-3 pt-4">
          <button type="button" onclick="batalFormAbsensi()" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2.5 rounded-xl">
            Batal
          </button>
          <button type="submit" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl shadow">
            Simpan
          </button>
        </div>
      </form>
    </div>

    <!-- Riwayat Absensi Siswa -->
    <div id="siswaRiwayat" class="hidden p-6 flex-1 flex flex-col">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h3 class="text-lg font-bold">Riwayat Absensi</h3>
        <button onclick="kembaliKeMenuSiswa()" class="text-sm text-blue-600 font-semibold hover:underline">
          <i class="fas fa-arrow-left"></i> Kembali
        </button>
      </div>
      <div id="listRiwayatContainer" class="space-y-3 overflow-y-auto flex-1"></div>
    </div>
  </div>

  <!-- 3. DASHBOARD GURU -->
  <div id="viewGuru" class="hidden max-w-6xl mx-auto p-4 md:p-6">
    <header class="bg-white p-6 rounded-2xl shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
      <div>
        <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-md">Panel Monitoring Guru</span>
        <h2 id="guruHeaderNama" class="text-xl font-bold mt-1">Nama Guru</h2>
      </div>
      <div class="flex flex-wrap gap-2">
        <button onclick="exportToCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium shadow">
          <i class="fas fa-file-excel mr-1"></i> Ekspor ke Excel (CSV)
        </button>
        <button onclick="muatDataGuru()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium">
          <i class="fas fa-sync-alt mr-1"></i> Refresh
        </button>
        <button onclick="logout()" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-xl text-sm font-medium">
          <i class="fas fa-sign-out-alt mr-1"></i> Keluar
        </button>
      </div>
    </header>

    <!-- Filter Pencarian -->
    <div class="bg-white p-4 rounded-2xl shadow-sm mb-6 flex flex-col md:flex-row gap-3">
      <input type="text" id="filterNama" onkeyup="filterTabelGuru()" placeholder="Cari nama siswa atau kelas..." class="flex-1 px-4 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
      <input type="text" id="filterTanggal" onkeyup="filterTabelGuru()" placeholder="Filter tanggal (misal: 15/11/2026)..." class="md:w-64 px-4 py-2 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Tabel Data Absensi -->
    <div class="bg-white rounded-2xl shadow-sm overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-50 border-b text-xs uppercase text-slate-500">
            <th class="p-4">Waktu</th>
            <th class="p-4">NISN</th>
            <th class="p-4">Nama Siswa</th>
            <th class="p-4">Kelas</th>
            <th class="p-4">Status</th>
            <th class="p-4 text-center">Bukti Foto</th>
            <th class="p-4 text-center">Lokasi GPS</th>
          </tr>
        </thead>
        <tbody id="tabelGuruBody" class="divide-y text-sm"></tbody>
      </table>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyXVLE0Ptxlh18kMRE5_jfcILwQAX83aDW_S26l9kyYdoxQJ2SEZx14yciQlDSXFoOw/exec";

    let currentUser = null;
    let compressedBase64 = "";
    let allAbsensiGuru = [];

    window.onload = () => {
      const savedUser = localStorage.getItem("prakerin_user");
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        arahkanDashboard();
      }
    };

    function showLoading(show, text = "Memproses...") {
      document.getElementById("loadingText").innerText = text;
      document.getElementById("loadingOverlay").classList.toggle("hidden", !show);
    }

    async function postToGAS(payload) {
      const response = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      return await response.json();
    }

    document.getElementById("formLogin").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("loginId").value;
      const password = document.getElementById("loginPassword").value;

      showLoading(true, "Memverifikasi akun...");
      try {
        const res = await postToGAS({ action: "login", id, password });
        if (res.status === "success") {
          currentUser = res.user;
          localStorage.setItem("prakerin_user", JSON.stringify(currentUser));
          arahkanDashboard();
        } else {
          alert(res.message);
        }
      } catch (err) {
        alert("Gagal terhubung ke server.");
      } finally {
        showLoading(false);
      }
    });

    function arahkanDashboard() {
      document.getElementById("viewLogin").classList.add("hidden");
      if (currentUser.role === "siswa") {
        document.getElementById("viewSiswa").classList.remove("hidden");
        document.getElementById("siswaHeaderNama").innerText = currentUser.nama;
        document.getElementById("siswaHeaderKelas").innerText = "Kelas: " + currentUser.kelas;
      } else if (currentUser.role === "guru") {
        document.getElementById("viewGuru").classList.remove("hidden");
        document.getElementById("guruHeaderNama").innerText = currentUser.nama;
        muatDataGuru();
      }
    }

    function logout() {
      localStorage.removeItem("prakerin_user");
      location.reload();
    }

    function bukaFormAbsensi() {
      document.getElementById("siswaMenuUtama").classList.add("hidden");
      document.getElementById("siswaFormAbsensi").classList.remove("hidden");

      document.getElementById("absenNisn").value = currentUser.id;
      document.getElementById("absenNama").value = currentUser.nama;
      document.getElementById("absenStatus").value = "Masuk";
      ubahStatusAbsen();

      const now = new Date();
      const daftarHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
      document.getElementById("absenHari").value = daftarHari[now.getDay()];
      document.getElementById("absenTanggal").value = now.toLocaleDateString("id-ID");
      document.getElementById("absenWaktu").value = now.toLocaleTimeString("id-ID", { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      ambilLokasi();
    }

    function ubahStatusAbsen() {
      const status = document.getElementById("absenStatus").value;
      const wrapKet = document.getElementById("wrapperKeterangan");
      const wrapFoto = document.getElementById("wrapperFoto");
      const wrapLokasi = document.getElementById("wrapperLokasi");

      if (status === "Izin") {
        wrapKet.classList.remove("hidden");
        document.getElementById("absenKeterangan").required = true;
      } else {
        wrapKet.classList.add("hidden");
        document.getElementById("absenKeterangan").required = false;
      }
    }

    function batalFormAbsensi() {
      document.getElementById("formAbsen").reset();
      document.getElementById("fotoPreview").classList.add("hidden");
      compressedBase64 = "";
      document.getElementById("siswaFormAbsensi").classList.add("hidden");
      document.getElementById("siswaMenuUtama").classList.remove("hidden");
    }

    function ambilLokasi() {
      const locText = document.getElementById("absenLokasiText");
      locText.value = "Mengambil titik GPS...";
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude.toFixed(6);
            const lng = pos.coords.longitude.toFixed(6);
            document.getElementById("absenLat").value = lat;
            document.getElementById("absenLng").value = lng;
            locText.value = `${lat}, ${lng}`;
          },
          (err) => {
            locText.value = "GPS tidak aktif / izin ditolak";
          },
          { enableHighAccuracy: true }
        );
      } else {
        locText.value = "Browser tidak mendukung GPS";
      }
    }

    document.getElementById("absenFotoInput").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const MAX_WIDTH = 800;
          const scaleSize = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scaleSize;

          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          compressedBase64 = canvas.toDataURL("image/jpeg", 0.7);

          const preview = document.getElementById("fotoPreview");
          preview.src = compressedBase64;
          preview.classList.remove("hidden");
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("formAbsen").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("absenStatus").value;
      const lat = document.getElementById("absenLat").value || "-";
      const lng = document.getElementById("absenLng").value || "-";
      const keterangan = document.getElementById("absenKeterangan").value || "-";

      const payload = {
        action: "submitAbsensi",
        nisn: currentUser.id,
        nama: currentUser.nama,
        kelas: currentUser.kelas,
        status: status,
        hari: document.getElementById("absenHari").value,
        tanggal: document.getElementById("absenTanggal").value,
        waktu: document.getElementById("absenWaktu").value,
        keterangan: keterangan,
        fotoBase64: compressedBase64,
        latitude: lat,
        longitude: lng
      };

      showLoading(true, "Mengirim data absensi...");
      try {
        const res = await postToGAS(payload);
        if (res.status === "success") {
          alert(res.message);
          batalFormAbsensi();
        } else {
          alert("Error: " + res.message);
        }
      } catch (err) {
        alert("Terjadi kesalahan jaringan.");
      } finally {
        showLoading(false);
      }
    });

    async function bukaRiwayatSiswa() {
      document.getElementById("siswaMenuUtama").classList.add("hidden");
      document.getElementById("siswaRiwayat").classList.remove("hidden");
      const container = document.getElementById("listRiwayatContainer");
      container.innerHTML = "<p class='text-center text-sm text-slate-500 py-8'>Memuat riwayat...</p>";

      try {
        const res = await postToGAS({ action: "getRiwayatSiswa", nisn: currentUser.id });
        if (res.status === "success" && res.data.length > 0) {
          container.innerHTML = res.data.map(item => `
            <div class="border rounded-xl p-3.5 bg-slate-50 flex justify-between items-center">
              <div>
                <div class="flex items-center gap-2">
                  <span class="px-2 py-0.5 rounded text-xs font-bold ${item.status === 'Masuk' ? 'bg-emerald-100 text-emerald-700' : item.status === 'Pulang' ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700'}">${item.status}</span>
                  <span class="font-bold text-sm text-slate-800">${item.hari}, ${item.tanggal}</span>
                </div>
                <p class="text-xs text-slate-500 mt-1"><i class="far fa-clock"></i> Pukul ${item.waktu} ${item.keterangan !== '-' ? `| Ket: ${item.keterangan}` : ''}</p>
                ${item.lat !== '-' ? `<a href="https://maps.google.com/?q=${item.lat},${item.lng}" target="_blank" class="text-xs text-blue-600 hover:underline mt-1 inline-block"><i class="fas fa-map-marker-alt"></i> Lokasi GPS</a>` : ''}
              </div>
              ${item.fotoUrl !== 'Tidak ada foto' ? `<a href="${item.fotoUrl}" target="_blank" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold">Foto</a>` : ''}
            </div>
          `).join("");
        } else {
          container.innerHTML = "<p class='text-center text-sm text-slate-500 py-8'>Belum ada riwayat absensi.</p>";
        }
      } catch (err) {
        container.innerHTML = "<p class='text-center text-sm text-rose-500 py-8'>Gagal memuat data.</p>";
      }
    }

    function kembaliKeMenuSiswa() {
      document.getElementById("siswaRiwayat").classList.add("hidden");
      document.getElementById("siswaMenuUtama").classList.remove("hidden");
    }

    async function muatDataGuru() {
      showLoading(true, "Memuat data absensi siswa...");
      try {
        const res = await postToGAS({ action: "getAllAbsensi" });
        if (res.status === "success") {
          allAbsensiGuru = res.data;
          renderTabelGuru(allAbsensiGuru);
        }
      } catch (err) {
        alert("Gagal memuat data monitoring.");
      } finally {
        showLoading(false);
      }
    }

    function renderTabelGuru(data) {
      const tbody = document.getElementById("tabelGuruBody");
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400">Tidak ada data absensi.</td></tr>`;
        return;
      }
      tbody.innerHTML = data.map(row => `
        <tr class="hover:bg-slate-50">
          <td class="p-4">
            <div class="font-semibold">${row.hari}, ${row.tanggal}</div>
            <div class="text-xs text-slate-500">${row.waktu}</div>
          </td>
          <td class="p-4 font-mono text-xs">${row.nisn}</td>
          <td class="p-4 font-medium">
            ${row.nama}
            ${row.keterangan !== '-' ? `<div class="text-xs text-amber-600 mt-0.5">Ket: ${row.keterangan}</div>` : ''}
          </td>
          <td class="p-4"><span class="bg-slate-100 px-2 py-1 rounded text-xs font-semibold">${row.kelas}</span></td>
          <td class="p-4">
            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${row.status === 'Masuk' ? 'bg-emerald-100 text-emerald-700' : row.status === 'Pulang' ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700'}">
              ${row.status}
            </span>
          </td>
          <td class="p-4 text-center">
            ${row.fotoUrl !== 'Tidak ada foto' ? `<a href="${row.fotoUrl}" target="_blank" class="bg-emerald-100 text-emerald-700 hover:bg-emerald-200 px-3 py-1 rounded-lg text-xs font-semibold inline-block"><i class="fas fa-image mr-1"></i> Foto</a>` : '<span class="text-xs text-slate-400">-</span>'}
          </td>
          <td class="p-4 text-center">
            ${row.lat !== '-' ? `<a href="https://maps.google.com/?q=${row.lat},${row.lng}" target="_blank" class="bg-blue-100 text-blue-700 hover:bg-blue-200 px-3 py-1 rounded-lg text-xs font-semibold inline-block"><i class="fas fa-map-marker-alt mr-1"></i> Maps</a>` : '<span class="text-xs text-slate-400">-</span>'}
          </td>
        </tr>
      `).join("");
    }

    function filterTabelGuru() {
      const qNama = document.getElementById("filterNama").value.toLowerCase();
      const qTgl = document.getElementById("filterTanggal").value.toLowerCase();

      const filtered = allAbsensiGuru.filter(item => {
        const matchNamaKelas = item.nama.toLowerCase().includes(qNama) || item.kelas.toLowerCase().includes(qNama);
        const matchTgl = item.tanggal.toLowerCase().includes(qTgl);
        return matchNamaKelas && matchTgl;
      });
      renderTabelGuru(filtered);
    }

    // Fitur Ekspor ke Excel (CSV) langsung dari browser
    function exportToCSV() {
      if (allAbsensiGuru.length === 0) {
        alert("Tidak ada data untuk diekspor.");
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,";
      csvContent += "NISN,Nama Siswa,Kelas,Status,Hari,Tanggal,Waktu,Keterangan,Foto URL,Latitude,Longitude\r\n";

      allAbsensiGuru.forEach(row => {
        const rowData = [
          `"${row.nisn}"`,
          `"${row.nama}"`,
          `"${row.kelas}"`,
          `"${row.status}"`,
          `"${row.hari}"`,
          `"${row.tanggal}"`,
          `"${row.waktu}"`,
          `"${row.keterangan}"`,
          `"${row.fotoUrl}"`,
          `"${row.lat}"`,
          `"${row.lng}"`
        ];
        csvContent += rowData.join(",") + "\r\n";
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Rekap_Absensi_Prakerin_${new Date().toLocaleDateString("id-ID").replace(/\//g, "-")}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
